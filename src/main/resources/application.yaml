spring:
  application:
    name: vobar-backend
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGO_URI}
  data:
    mongodb:
      auto-index-creation: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
